<svg xmlns="http://www.w3.org/2000/svg">
  <!-- ========================================================================
       RouteFlow Icons — "da blüh ich auf" Design
       Warme Terrakotta, Salbeigrün, Senfgelb Palette
       Hand-drawn / playful aesthetic
       ======================================================================== -->

  <!-- === Hub / Startpunkt ==== -->
  <symbol id="hub-icon" viewBox="0 0 24 24">
    <!-- Hub Building -->
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Building base -->
      <rect x="4" y="12" width="16" height="8" rx="2" fill="currentColor" fill-opacity="0.12"/>
      <rect x="4" y="12" width="16" height="8" rx="2" stroke="none"/>
      <!-- Windows -->
      <rect x="7" y="14" width="2.5" height="2.5" rx="0.5" fill="currentColor" fill-opacity="0.25"/>
      <rect x="11.5" y="14" width="2.5" height="2.5" rx="0.5" fill="currentColor" fill-opacity="0.25"/>
      <rect x="16" y="14" width="2.5" height="2.5" rx="0.5" fill="currentColor" fill-opacity="0.25"/>
      <!-- Door -->
      <rect x="10" y="17" width="4" height="3" rx="0.5" fill="currentColor" fill-opacity="0.25"/>
      <!-- Roof -->
      <path d="M3 12 L12 4 L21 12" fill="currentColor" fill-opacity="0.18" stroke="none"/>
      <path d="M3 12 L12 4 L21 12" stroke="currentColor" stroke-width="1.5"/>
      <!-- Pulsing ring indicator -->
      <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 2" opacity="0.3"/>
    </g>
    <!-- Central pin -->
    <circle cx="12" cy="12" r="3" fill="currentColor"/>
    <circle cx="12" cy="12" r="1.5" fill="#f8f9fb"/>
  </symbol>

  <!-- === Pin / Marker ==== -->
  <symbol id="pin-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Pin body -->
      <path d="M12 2 C8.5 2 6 4.5 6 8 C6 13 12 20 12 20 C12 20 18 13 18 8 C18 4.5 15.5 2 12 2 Z" fill="currentColor" fill-opacity="0.25"/>
      <path d="M12 2 C8.5 2 6 4.5 6 8 C6 13 12 20 12 20" stroke="currentColor"/>
      <!-- Pin tip -->
      <circle cx="12" cy="8" r="2" fill="currentColor"/>
      <circle cx="12" cy="8" r="1" fill="#f8f9fb"/>
    </g>
  </symbol>

  <!-- === Numbered Pin (dynamic via CSS) ==== -->
  <symbol id="pin-numbered-icon" viewBox="0 0 24 24">
    <use href="#pin-icon" width="24" height="24"/>
    <!-- Number will be added via text element in React -->
  </symbol>

  <!-- === Delivery Van ==== -->
  <symbol id="van-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Van body -->
      <path d="M3 17 L3 12 Q3 10 5 10 L17 10 Q19 10 19 12 L19 17" fill="currentColor" fill-opacity="0.2"/>
      <path d="M3 17 L3 12 Q3 10 5 10 L17 10 Q19 10 19 12 L19 17" stroke="currentColor"/>
      <!-- Window -->
      <rect x="7" y="12" width="6" height="4" rx="1" fill="#f8f9fb" stroke="currentColor" stroke-width="1"/>
      <!-- Wheels -->
      <circle cx="7" cy="17" r="2.5" fill="currentColor" fill-opacity="0.3"/>
      <circle cx="7" cy="17" r="1.5" fill="#f8f9fb"/>
      <circle cx="15" cy="17" r="2.5" fill="currentColor" fill-opacity="0.3"/>
      <circle cx="15" cy="17" r="1.5" fill="#f8f9fb"/>
    </g>
  </symbol>

  <!-- === Package / Box ==== -->
  <symbol id="package-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10 L3 8 Q3 6 5 6 L7 6 L7 3 Q7 1 9 1 L15 1 Q17 1 17 3 L17 6 L19 6 Q21 6 21 8 L21 10" fill="none"/>
      <rect x="5" y="8" width="14" height="8" rx="1" fill="currentColor" fill-opacity="0.15" stroke="currentColor"/>
      <path d="M5 8 L5 16 L19 16 L19 8" stroke="currentColor"/>
      <!-- Flaps -->
      <path d="M5 8 L3 10 L5 12" stroke="currentColor"/>
      <path d="M19 8 L21 10 L19 12" stroke="currentColor"/>
      <path d="M5 16 L3 18 L5 20" stroke="currentColor"/>
      <path d="M19 16 L21 18 L19 20" stroke="currentColor"/>
    </g>
  </symbol>

  <!-- === Route / Path ==== -->
  <symbol id="route-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12 C8 6 12 18 16 12 S20 8 21 12" stroke-dasharray="6 4"/>
      <circle cx="3" cy="12" r="2" fill="currentColor"/>
      <circle cx="12" cy="12" r="2" fill="currentColor"/>
      <circle cx="21" cy="12" r="2" fill="currentColor"/>
    </g>
  </symbol>

  <!-- === Plus / Add ==== -->
  <symbol id="plus-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5 L12 19"/>
      <path d="M5 12 L19 12"/>
    </g>
  </symbol>

  <!-- === Minus / Remove ==== -->
  <symbol id="minus-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12 L19 12"/>
    </g>
  </symbol>

  <!-- === Trash / Delete ==== -->
  <symbol id="trash-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="16" height="14" rx="2" fill="currentColor" fill-opacity="0.1"/>
      <path d="M4 6 L20 6"/>
      <path d="M8 6 L8 18"/>
      <path d="M12 6 L12 18"/>
      <path d="M16 6 L16 18"/>
      <path d="M8 2 L8 4"/>
      <path d="M12 2 L12 4"/>
      <path d="M16 2 L16 4"/>
    </g>
  </symbol>

  <!-- === Upload / Excel ==== -->
  <symbol id="upload-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15 V19 C21 20.1046 20.1046 21 19 21 H5 C3.89543 21 3 20.1046 3 19 V15"/>
      <path d="M7 9 L12 4 L17 9"/>
      <path d="M12 4 L12 15"/>
    </g>
  </symbol>

  <!-- === Checkmark / Success ==== -->
  <symbol id="check-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 13 L9 17 L19 7"/>
    </g>
  </symbol>

  <!-- === Warning / Alert ==== -->
  <symbol id="warning-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2 L12 10"/>
      <path d="M12 14 L12 18"/>
      <path d="M12 20 C8.68629 20 6 17.3137 6 14 C6 10.6863 8.68629 8 12 8 C15.3137 8 18 10.6863 18 14 C18 17.3137 15.3137 20 12 20 Z"/>
      <path d="M12 10 L12 14"/>
      <path d="M12 18 L12 20"/>
    </g>
  </symbol>

  <!-- === Error / X ==== -->
  <symbol id="error-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6 L6 18"/>
      <path d="M6 6 L18 18"/>
    </g>
  </symbol>

  <!-- === Edit / Pencil ==== -->
  <symbol id="edit-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 4 L15 8 L20 3"/>
      <path d="M20 3 L15 8"/>
      <path d="M4 17 L4 20"/>
      <path d="M4 20 L7 17"/>
      <path d="M19.0714 8.34949 L15.6505 11.7704 L11.2295 7.34949 L7.80851 10.7705 L4.3875 7.34949 L10.2295 1.5"/>
    </g>
  </symbol>

  <!-- === Settings / Gear ==== -->
  <symbol id="settings-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19.1431 12.9497 L19.1431 14.5879 C19.1431 16.6507 17.3138 18.48 15.251 18.48 L12.749 18.48 C10.6862 18.48 8.85689 16.6507 8.85689 14.5879 L8.85689 12.9497"/>
      <path d="M12.0002 10.6113 C13.3185 10.6113 14.3881 9.54165 14.3881 8.22344 C14.3881 6.90523 13.3185 5.83562 12.0002 5.83562 C10.6819 5.83562 9.61229 6.90523 9.61229 8.22344 C9.61229 9.54165 10.6819 10.6113 12.0002 10.6113 Z"/>
      <path d="M12.0002 18.48 C13.7527 18.48 15.251 17.0434 15.251 15.2909"/>
      <path d="M8.85689 18.48 C10.1751 18.48 11.2448 17.4103 11.2448 16.0921"/>
      <path d="M15.251 5.83562 C16.5693 5.83562 17.6389 6.90523 17.6389 8.22344"/>
      <path d="M19.1431 5.83562 C20.4613 5.83562 21.531 6.90523 21.531 8.22344"/>
      <path d="M19.1431 8.22344 C20.4613 8.22344 21.531 9.29305 21.531 10.6113"/>
      <path d="M8.85689 8.22344 C7.53868 8.22344 6.46898 9.29305 6.46898 10.6113"/>
      <path d="M8.85689 5.83562 C7.53868 5.83562 6.46898 6.90523 6.46898 8.22344"/>
      <circle cx="12.0002" cy="12.0002" r="2.5" fill="currentColor" fill-opacity="0.15"/>
    </g>
  </symbol>

  <!-- === Stats / Bar Chart ==== -->
  <symbol id="stats-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 18 L3 20"/>
      <path d="M7 14 L7 20"/>
      <path d="M12 8 L12 20"/>
      <path d="M17 12 L17 20"/>
      <path d="M21 4 L21 20"/>
      <path d="M3 20 L7 20 L12 20 L17 20 L21 20"/>
    </g>
  </symbol>

  <!-- === Leaf / Flower ==== -->
  <symbol id="leaf-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2 C8 4 4 8 2 12 C2 16 4 20 8 22 C12 20 16 16 22 12 C20 8 16 4 12 2 Z" fill="currentColor" fill-opacity="0.15"/>
      <path d="M12 2 C8 4 4 8 2 12 C2 16 4 20 8 22"/>
      <path d="M12 12 L12 22"/>
      <path d="M20 12 C20 16 16 20 12 22"/>
      <path d="M4 12 C4 16 8 20 12 22"/>
    </g>
  </symbol>

  <!-- === Sun / Brightness ==== -->
  <symbol id="sun-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4" fill="currentColor" fill-opacity="0.15"/>
      <circle cx="12" cy="12" r="4" stroke="currentColor"/>
      <path d="M12 2 L12 4"/>
      <path d="M12 20 L12 22"/>
      <path d="M22 12 L20 12"/>
      <path d="M2 12 L4 12"/>
      <path d="M19.0711 4.92893 L17.5026 6.49739"/>
      <path d="M6.49739 17.5026 L4.92893 19.0711"/>
      <path d="M19.0711 19.0711 L17.5026 17.5026"/>
      <path d="M6.49739 6.49739 L4.92893 4.92893"/>
    </g>
  </symbol>

  <!-- === Arrow Left ==== -->
  <symbol id="arrow-left-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18 L9 12 L15 6"/>
    </g>
  </symbol>

  <!-- === Arrow Right ==== -->
  <symbol id="arrow-right-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18 L15 12 L9 6"/>
    </g>
  </symbol>

  <!-- === Arrow Down ==== -->
  <symbol id="arrow-down-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 9 L12 15 L18 9"/>
    </g>
  </symbol>

  <!-- === Arrow Up ==== -->
  <symbol id="arrow-up-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 15 L12 9 L6 15"/>
    </g>
  </symbol>

  <!-- === Drag Handle ==== -->
  <symbol id="drag-handle-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="6" r="1" fill="currentColor"/>
      <circle cx="12" cy="12" r="1" fill="currentColor"/>
      <circle cx="12" cy="18" r="1" fill="currentColor"/>
      <circle cx="6" cy="12" r="1" fill="currentColor"/>
      <circle cx="18" cy="12" r="1" fill="currentColor"/>
    </g>
  </symbol>

  <!-- === Search / Magnifying Glass ==== -->
  <symbol id="search-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="6"/>
      <path d="M20 20 L16 16"/>
    </g>
  </symbol>

  <!-- === Info / Circle I ==== -->
  <symbol id="info-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 16 L12 12"/>
      <path d="M12 8 L12 8.01"/>
    </g>
  </symbol>

  <!-- === Help / Question Mark ==== -->
  <symbol id="help-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 16 L12 12"/>
      <path d="M12 8 C12 8 12 6.5 14 6.5 C14 6.5 14 8 12 8 Z"/>
    </g>
  </symbol>

  <!-- === User / Profile ==== -->
  <symbol id="user-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="10" r="4"/>
      <path d="M12 14 C9.79086 14 8 15.7909 8 18 C8 19.1046 8.89543 20 10 20 H14 C15.1046 20 16 19.1046 16 18 C16 15.7909 14.2091 14 12 14 Z"/>
    </g>
  </symbol>

  <!-- === Home / House ==== -->
  <symbol id="home-icon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10 L3 20 L12 20 L21 20 L21 10"/>
      <path d="M3 10 L12 2 L21 10"/>
      <path d="M8 10 L8 20"/>
      <path d="M16 10 L16 20"/>
    </g>
  </symbol>
</svg>