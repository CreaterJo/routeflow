<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background: deep navy rounded square -->
  <rect width="100" height="100" rx="22" fill="#071437"/>
  <!-- Subtle accent gradient overlay -->
  <defs>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1416c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#50cd89" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#accentGradient)"/>

  <!-- Delivery van silhouette - playful, hand-drawn style -->
  <g transform="translate(12, 32)" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Van body -->
    <path d="M4 30 L4 14 Q4 10 8 10 L38 10 Q42 10 42 14 L42 30" fill="white" fill-opacity="0.95" stroke="white" stroke-width="0.5"/>
    <!-- Window -->
    <path d="M14 14 L14 22 L24 22 L24 14" fill="#ffffff" stroke="#f1416c" stroke-width="1.5"/>
    <!-- Wheel 1 -->
    <circle cx="12" cy="30" r="5" fill="#131313"/>
    <circle cx="12" cy="30" r="2.5" fill="white"/>
    <!-- Wheel 2 -->
    <circle cx="34" cy="30" r="5" fill="#131313"/>
    <circle cx="34" cy="30" r="2.5" fill="white"/>
  </g>

  <!-- Small leaf/flower accent - "da blüh ich auf" -->
  <g transform="translate(70, 20)" fill="white" fill-opacity="0.9">
    <ellipse cx="4" cy="8" rx="3" ry="5" transform="rotate(-30 4 8)"/>
    <ellipse cx="8" cy="4" rx="5" ry="3" transform="rotate(30 8 4)"/>
    <ellipse cx="10" cy="10" rx="3" ry="5" transform="rotate(60 10 10)"/>
    <circle cx="7" cy="7" r="2" fill="#f1416c"/>
  </g>

  <!-- Route line with dots -->
  <g stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M15 75 Q35 65 55 75 Q75 85 85 75" fill="none" stroke-dasharray="6 4"/>
    <circle cx="15" cy="75" r="3" fill="#f1416c"/>
    <circle cx="55" cy="75" r="3" fill="#50cd89"/>
    <circle cx="85" cy="75" r="3" fill="white"/>
  </g>
</svg>